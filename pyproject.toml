[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ai"
version = "2.0.0"
description = "Local-first AI Shorts editor with Gemini multi-candidate Visual Director, unique stock selection and bounded retrieval"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1.0"]
vision = ["opencv-python-headless>=4.10", "numpy>=1.26"]
semantic = ["torch>=2.3", "transformers>=4.44", "pillow>=10.4"]
local = ["faster-whisper>=1.1.0", "opencv-python-headless>=4.10", "numpy>=1.26"]
full = ["faster-whisper>=1.1.0", "opencv-python-headless>=4.10", "numpy>=1.26", "torch>=2.3", "transformers>=4.44", "pillow>=10.4"]

[project.scripts]
video-ai = "video_ai.cli:main"
video-ai-web = "video_ai.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_ai = ["web_static/*"]
