[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ai"
version = "0.3.0"
description = "Local-first AI short video editor"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1.0"]
vision = ["opencv-python-headless>=4.10", "numpy>=1.26"]
local = ["faster-whisper>=1.1.0", "opencv-python-headless>=4.10", "numpy>=1.26"]

[project.scripts]
video-ai = "video_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
